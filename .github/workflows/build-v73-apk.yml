name: build-v73-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout MobiInfer source (v0.3-alpha)
        uses: actions/checkout@v4
        with:
          repository: IPADS-SAI/Mobiinfer-Android
          ref: v0.3-alpha
          path: src

      - name: Build Hexagon v73 skel
        working-directory: src
        run: |
          set -eux
          cp docs/backend/snapdragon/CMakeUserPresets.json .
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            --platform linux/amd64 ghcr.io/snapdragon-toolchain/arm64-android:v0.8 \
            bash -lc 'cmake --preset arm64-android-snapdragon-release -B build-snapdragon && cmake --build build-snapdragon --target htp-v73 -j"$(nproc)"'
          ls -l build-snapdragon/ggml/src/ggml-hexagon/libggml-htp-v73.so

      - name: Patch official v0.3 APK with v73 skel
        run: |
          set -eux
          curl -fL -o base.apk \
            https://github.com/IPADS-SAI/Mobiinfer-Android/releases/download/v0.3-alpha/MobiInfer-Android-v0.3.apk
          sha256sum base.apk
          mkdir -p x
          (cd x && unzip -q ../base.apk)
          cp src/build-snapdragon/ggml/src/ggml-hexagon/libggml-htp-v73.so x/lib/arm64-v8a/
          ls -l x/lib/arm64-v8a/ | grep htp
          (cd x && zip -q -r -X ../patched.apk . -x 'META-INF/*')

      - name: Align and sign
        run: |
          set -eux
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android \
            -alias v73 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MobiInfer v73"
          keytool -list -v -keystore ks.jks -storepass android | grep -i "SHA256:" || true
          "$BT/zipalign" -f 4 patched.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:android --key-pass pass:android \
            --out MobiInfer-Android-v0.3-v73.apk aligned.apk
          "$BT/apksigner" verify --print-certs MobiInfer-Android-v0.3-v73.apk
          sha256sum MobiInfer-Android-v0.3-v73.apk

      - name: Upload APK + skel
        uses: actions/upload-artifact@v4
        with:
          name: mobiinfer-v73
          retention-days: 14
          path: |
            MobiInfer-Android-v0.3-v73.apk
            src/build-snapdragon/ggml/src/ggml-hexagon/libggml-htp-v73.so
