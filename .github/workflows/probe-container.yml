name: probe-container
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe toolchain container
        run: |
          docker run --rm --platform linux/amd64 ghcr.io/snapdragon-toolchain/arm64-android:v0.8 \
            bash -lc 'echo NDK=$ANDROID_NDK_ROOT; ls "$ANDROID_NDK_ROOT/build/cmake/" 2>&1 | head; echo SDK=$HEXAGON_SDK_ROOT; echo TOOLS=$HEXAGON_TOOLS_ROOT; which ninja make cmake; cmake --version | head -1; ls /opt 2>&1'
