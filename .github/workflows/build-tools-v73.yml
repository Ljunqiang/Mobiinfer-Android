name: build-tools-v73

on:
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout MobiInfer source (v0.3-alpha)
        uses: actions/checkout@v4
        with:
          repository: IPADS-SAI/Mobiinfer-Android
          ref: v0.3-alpha
          path: src

      - name: Build full Android package (tools + all 4 HTP skels)
        working-directory: src
        run: |
          set -eux
          cp docs/backend/snapdragon/CMakeUserPresets.json .
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            --platform linux/amd64 ghcr.io/snapdragon-toolchain/arm64-android:v0.8 \
            bash -lc 'cmake --preset arm64-android-snapdragon-release -B build-snapdragon -DLLAMA_BUILD_TESTS=ON -DGGML_OPENCL=OFF && cmake --build build-snapdragon -j"$(nproc)" && cmake --install build-snapdragon --prefix pkg-adb'
          ls -l pkg-adb/llama.cpp/bin | head -40
          ls -l pkg-adb/llama.cpp/lib | head -30

      - name: Pack
        working-directory: src
        run: |
          set -eux
          tar czf mobiinfer-tools-v73.tar.gz -C pkg-adb .
          ls -lh mobiinfer-tools-v73.tar.gz
          sha256sum mobiinfer-tools-v73.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mobiinfer-tools-v73
          retention-days: 14
          path: src/mobiinfer-tools-v73.tar.gz

