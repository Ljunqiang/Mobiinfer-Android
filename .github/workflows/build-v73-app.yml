name: build-v73-app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout patched source (fork branch v73)
        uses: actions/checkout@v4
        with:
          repository: Ljunqiang/Mobiinfer-Android
          ref: v73
          path: src

      - name: Build libmobiinfer.so (app JNI, with debug.moe.* overrides)
        working-directory: src
        run: |
          set -eux
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            --platform linux/amd64 ghcr.io/snapdragon-toolchain/arm64-android:v0.8 \
            bash -lc '
              cmake -S Android-App/MobiInfer-Android/app/src/main/cpp -B build-app \
                -DCMAKE_TOOLCHAIN_FILE=/opt/android-ndk-r28b/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DLLAMA_SRC=/workspace -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_TOOLS=ON \
                -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=ON \
                -DGGML_HEXAGON=OFF -DGGML_OPENCL=OFF \
              && cmake --build build-app --target mobiinfer -j"$(nproc)"'
          find build-app -name "libmobiinfer.so" -exec ls -l {} \;

      - name: Patch official v0.3 APK with new libmobiinfer.so
        run: |
          set -eux
          curl -fL -o base.apk \
            https://github.com/IPADS-SAI/Mobiinfer-Android/releases/download/v0.3-alpha/MobiInfer-Android-v0.3.apk
          mkdir -p x
          (cd x && unzip -q ../base.apk)
          NEW=$(find src/build-app -name libmobiinfer.so | head -1)
          cp "$NEW" x/lib/arm64-v8a/libmobiinfer.so
          ls -l x/lib/arm64-v8a/libmobiinfer.so
          rm -f x/META-INF/*.RSA x/META-INF/*.SF x/META-INF/*.MF
          (cd x && zip -q -r -X ../patched.apk .)
          (cd x && zip -q -X -0 ../patched.apk resources.arsc)

      - name: Sign with fixed debug key
        run: |
          set -eux
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          base64 -d src/ci/keystore.b64 > ks.p12
          "$BT/zipalign" -f 4 patched.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-pass pass:android --key-pass pass:android \
            --out MobiInfer-Android-v0.3-v73app.apk aligned.apk
          "$BT/apksigner" verify --print-certs MobiInfer-Android-v0.3-v73app.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mobiinfer-v73-app
          retention-days: 14
          path: MobiInfer-Android-v0.3-v73app.apk
